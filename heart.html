<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Менің жандарыма </title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    color: #fff;
}

.container {
    text-align: center;
}

h1 {
    font-size: 48px;
    color: #ff6eb4; /* жұмсақ неон түс */
    text-shadow: 0 0 8px #ff6eb4, 0 0 16px #ff6eb4;
    animation: glow 1.5s infinite alternate;
}

p {
    font-size: 20px;
    color: #ff9ec4;
    margin-top: 10px;
}

.heart {
    font-size: 35px;
    color: #ff4d88;
    text-shadow: 0 0 5px #ff4d88, 0 0 10px #ff4d88;
    display: inline-block;
    animation: pulse 1s infinite;
}

/* Пульс анимациясы */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

/* Жарық жарқыл */
@keyframes glow {
    0% { text-shadow: 0 0 8px #ff6eb4, 0 0 16px #ff6eb4; }
    50% { text-shadow: 0 0 12px #ff9ec4, 0 0 24px #ff9ec4; }
    100% { text-shadow: 0 0 8px #ff6eb4, 0 0 16px #ff6eb4; }
}

/* Жүректер қалқып тұратын анимация */
.floating-heart {
    position: fixed;
    top: -20px;
    font-size: 24px;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="container">
    <h1>LOVE YOU <span class="heart">❤️</span></h1>
    <p>Сендермен өмір әрдайым жарқырайды </p>
</div>

<script>
function createFloatingHeart() {
    const heart = document.createElement("div");
    heart.classList.add("floating-heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw"; // кездейсоқ орын
    heart.style.fontSize = (Math.random() * 20 + 20) + "px"; // кездейсоқ өлшем
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s"; // кездейсоқ жылдамдық

    document.body.appendChild(heart);

    // 5 секундтан кейін жою
    setTimeout(() => heart.remove(), 5000);
}

// Жүректер 250мс сайын пайда болады
setInterval(createFloatingHeart, 250);
</script>

</body>
</html>
